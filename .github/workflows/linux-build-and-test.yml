name: Linux build and test

on:
  push:
    paths-ignore:
      - ".github/workflows/macos-build.yml"
      - ".github/workflows/windows-build.yml"
      - "static/**"
      - "README.md"
      - "LICENSE"
      - "CHANGELOG"
  pull_request: {}

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  linux-build:
    name: Linux build job
    runs-on: ubuntu-latest
    container: docker.io/centos:8
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: update yum repo baseurl
        run: |
          sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/*.repo
          sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/*.repo
          sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/*.repo
          # yum clean all
          # yum makecache

      - name: install deps
        run: |
          yum install -y openssl-devel wget tar gcc gcc-c++ libuuid-devel automake autoconf libtool make git cmake python2
          ln -s /usr/bin/python2 /usr/bin/python
          wget https://github.com/libunwind/libunwind/archive/refs/tags/v1.2.1.tar.gz
          tar -zxvf v1.2.1.tar.gz && cd libunwind-1.2.1 && ./autogen.sh && ./configure && make && make install
          echo "/usr/local/lib" > /etc/ld.so.conf.d/usr-local.conf
          ldconfig

      - name: Check out repository code
        uses: actions/checkout@v3
        with:
          submodules: recursive
        
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      - name: Compile core library(Debug and Release)
        run: |
          make llbc config=Debug verbose=1 -j4
          make llbc config=Release verbose=1 -j4

      - name: Compile test targets(Debug and Release)
        run: |
          make tests config=Debug verbose=1 -j4
          make tests config=Release verbose=1 -j4

      - name: Compile pyllbc wrap library(Debug and Release)
        run: |
          make pyllbc config=Debug verbose=1 -j4
          make pyllbc config=Release verbose=1 -j4

      - name: Compile lullbc wrap library(Debug and Release)
        run: |
          make lullbc config=Debug verbose=1 -j4
          make lullbc config=Release verbose=1 -j4

      - name: "Upload output directory"
        uses: actions/upload-artifact@v4
        with:
          name: llbc_unit_test_artifact
          path: |
            output/Debug/libllbc_debug.so
            output/Debug/unit_test_debug
            output/Debug/unit_test_static_debug
            output/Release/libllbc.so
            output/Release/unit_test
            output/Release/unit_test_static

      - run: echo "🍏 This job's status is ${{ job.status }}."

  run-unit-test:
    needs: linux-build
    name: Run unit test
    runs-on: ubuntu-latest
    container: docker.io/centos:8
    steps:
      - name: update yum repo baseurl
        run: |
          sed -i s/mirror.centos.org/vault.centos.org/g /etc/yum.repos.d/*.repo
          sed -i s/^#.*baseurl=http/baseurl=http/g /etc/yum.repos.d/*.repo
          sed -i s/^mirrorlist=http/#mirrorlist=http/g /etc/yum.repos.d/*.repo
          # yum clean all
          # yum makecache

      - name: install runtime deps
        run: |
          yum install -y openssl-devel wget tar gcc gcc-c++ libuuid-devel automake autoconf libtool make git cmake python2
          ln -s /usr/bin/python2 /usr/bin/python
          wget https://github.com/libunwind/libunwind/archive/refs/tags/v1.2.1.tar.gz
          tar -zxvf v1.2.1.tar.gz && cd libunwind-1.2.1 && ./autogen.sh && ./configure && make && make install
          echo "/usr/local/lib" > /etc/ld.so.conf.d/usr-local.conf
          ldconfig

      - name: Download artifact from previous step(linux-build)
        uses: actions/download-artifact@v4
        with:
          name: llbc_unit_test_artifact
          path: output

      - name: Fix executable permission
        run: |
          echo "🔧 Granting executable permission to unit test binaries..."
          chmod +x output/Release/unit_test
          chmod +x output/Release/unit_test_static
          chmod +x output/Debug/unit_test_debug
          chmod +x output/Debug/unit_test_static_debug
          echo "✅ Executable permission granted."

      - name: Run unit test(Release version, linked to static library)
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "🚀 [1/4] Running unit test | Config: Release | Link: static 🧩"
          echo "════════════════════════════════════════════════════════════════"
          cd output/Release
          ./unit_test_static
          echo "🎉 [1/4] Release + static unit test PASSED ✅"

      - name: Run unit test(Release version, linked to shared library)
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "🚀 [2/4] Running unit test | Config: Release | Link: shared 🔗"
          echo "════════════════════════════════════════════════════════════════"
          cd output/Release
          LD_LIBRARY_PATH=. ./unit_test
          echo "🎉 [2/4] Release + shared unit test PASSED ✅"

      - name: Run unit test(Debug version, linked to static library)
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "🐞 [3/4] Running unit test | Config: Debug   | Link: static 🧩"
          echo "════════════════════════════════════════════════════════════════"
          cd output/Debug
          ./unit_test_static_debug
          echo "🎉 [3/4] Debug + static unit test PASSED ✅"

      - name: Run unit test(Debug version, linked to shared library)
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo "🐞 [4/4] Running unit test | Config: Debug   | Link: shared 🔗"
          echo "════════════════════════════════════════════════════════════════"
          cd output/Debug
          LD_LIBRARY_PATH=. ./unit_test_debug
          echo "🎉 [4/4] Debug + shared unit test PASSED ✅"

      - run: echo "🏁 All unit tests finished. Job status is ${{ job.status }} 🍏"


