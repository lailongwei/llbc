name: Codex PR Review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Check out pull-request merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Detect OpenAI API key
        id: openai_key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "${OPENAI_API_KEY}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run read-only Codex review
        id: run_codex
        if: steps.openai_key.outputs.available == 'true'
        continue-on-error: true
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          codex-args: '["--ephemeral"]'
          permission-profile: :read-only
          safety-strategy: drop-sudo

      - name: Explain skipped review
        if: steps.openai_key.outputs.available != 'true'
        run: |
          echo "### Codex review skipped" >> "${GITHUB_STEP_SUMMARY}"
          echo "The OPENAI_API_KEY secret is unavailable. This is expected for pull requests from forks." >> "${GITHUB_STEP_SUMMARY}"

      - name: Record non-blocking review failure
        if: steps.run_codex.outcome == 'failure'
        run: |
          echo "### Codex review unavailable" >> "${GITHUB_STEP_SUMMARY}"
          echo "The optional AI review failed. Deterministic CI remains the merge gate." >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish Codex review
    needs: review
    if: needs.review.outputs.final_message != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}

    steps:
      - name: Create or update review comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-pr-review -->';
            const body = `${marker}\n## Codex PR Review\n\n${process.env.CODEX_FINAL_MESSAGE}`;
            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };
            const { data: comments } = await github.rest.issues.listComments({
              ...issue,
              per_page: 100,
            });
            const previous = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.startsWith(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
